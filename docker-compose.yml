services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: officeops
      POSTGRES_USER: officeops
      POSTGRES_PASSWORD: officeops
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://officeops:officeops@db:5432/officeops
    ports: ["3000:3000"]
    depends_on: [db]
volumes: { postgres_data: {} }
