<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OfficeOps — Office task board</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#e4e7ec;--blue:#155eef;--bg:#f7f8fa;--card:#fff;--red:#d92d20;--orange:#dc6803;--amber:#f79009}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1040px;margin:auto;padding:24px 16px 60px}.header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{display:flex;gap:11px;align-items:center}.mark{width:38px;height:38px;display:grid;place-items:center;background:var(--blue);border-radius:11px;color:white;font-weight:900}.brand h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:13px;margin:3px 0 0}.button{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.primary{color:white;background:var(--blue)}.soft{background:#eaf0ff;color:#1747a8}.summary,.task,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px}.summary{display:flex;gap:22px;margin:22px 0;padding:14px 16px;flex-wrap:wrap}.summary b{display:block;font-size:18px}.summary span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:9px;margin:16px 0}.search{flex:1;padding:11px 12px;border:1px solid #cbd5e1;border-radius:9px;background:white}.select{padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:white}.tasks{display:grid;gap:9px}.task{display:flex;align-items:center;gap:12px;padding:14px 15px;border-left:4px solid transparent}.task.overdue{border-left-color:var(--red)}.check{width:36px;height:36px;border-radius:50%;background:white;border:2px solid #b7c2d0;color:transparent;font-size:17px}.check:hover{border-color:var(--blue);color:var(--blue)}.main{flex:1;min-width:0}.title{font-weight:750}.meta{display:flex;gap:11px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:12px}.pill{font-size:11px;font-weight:800;padding:5px 8px;border-radius:20px}.URGENT{color:#b42318;background:#fee4e2}.HIGH{color:#b54708;background:#fef0c7}.MEDIUM{color:#175cd3;background:#d1e9ff}.LOW{color:#475467;background:#eaecf0}.actions{display:flex;gap:6px}.mini{border:0;padding:7px 9px;border-radius:7px;background:#eef2f6;color:#344054;font-size:12px;font-weight:700}.empty{padding:45px;text-align:center;color:var(--muted)}dialog{border:0;border-radius:16px;padding:0;max-width:500px;width:calc(100% - 32px);box-shadow:0 20px 70px #10182855}dialog::backdrop{background:#10182866}.modal{padding:22px}.modal h2{margin:0 0 16px}.field{display:grid;gap:6px;margin:12px 0;font-weight:650}.field input,.field select{padding:10px;border:1px solid #cbd5e1;border-radius:8px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.notice{font-size:12px;color:var(--muted);margin-top:18px}.archive-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}@media(max-width:540px){.shell{padding:16px 12px}.task{align-items:flex-start}.pill{margin-top:3px}.actions{flex-direction:column}.toolbar{flex-wrap:wrap}.toolbar .search{flex-basis:100%}.summary{gap:16px}}
  </style>
</head>
<body>
  <main class="shell"><header class="header"><div class="brand"><div class="mark">✓</div><div><h1>OfficeOps</h1><p class="sub">Office work, ready when you are.</p></div></div><div><button class="button soft" id="plan">Plan my session</button> <button class="button primary" id="newTask">＋ New task</button></div></header>
  <section class="summary"><div><b id="openCount">0</b><span>open tasks</span></div><div><b id="overdueCount">0</b><span>overdue</span></div><div><b id="hours">~0 h</b><span>estimated work</span></div><button class="button soft" id="archive">Completed archive</button></section>
  <div class="toolbar"><input id="search" class="search" placeholder="Search tasks" aria-label="Search tasks"><select id="status" class="select"><option value="active">Open work</option><option value="OPEN">Open</option><option value="IN_PROGRESS">In progress</option><option value="COMPLETED">Completed</option></select><select id="priority" class="select"><option value="">All priorities</option><option>URGENT</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select></div>
  <section id="tasks" class="tasks" aria-live="polite"></section></main>
  <dialog id="taskDialog"><form class="modal" id="taskForm"><h2>Add an office task</h2><label class="field">What needs doing?<input name="title" minlength="3" maxlength="120" required placeholder="Mount TV in conference room B"></label><label class="field">Location <input name="location" placeholder="Conference room B"></label><label class="field">Priority <select name="priority"><option>MEDIUM</option><option>HIGH</option><option>URGENT</option><option>LOW</option></select></label><label class="field">Due date <input name="deadline" type="date"></label><p class="notice">An automatic estimate is added immediately. This static version stores tasks only in this browser.</p><div class="modal-actions"><button type="button" class="button soft" data-close>Cancel</button><button class="button primary">Create task</button></div></form></dialog>
  <dialog id="planDialog"><div class="modal"><h2>Plan my session</h2><label class="field">Available minutes <input id="minutes" type="number" min="15" max="480" value="60"></label><div id="planResult" class="notice"></div><div class="modal-actions"><button class="button primary" data-close>Done</button></div></div></dialog>
  <dialog id="archiveDialog"><div class="modal"><h2>Completed archive</h2><div id="archiveList"></div><div class="modal-actions"><button class="button primary" data-close>Done</button></div></div></dialog>
<script>
const key='officeops-static-v1'; const seed=[['Build TV stand for lobby','Furniture & Assembly',60,'HIGH'],['Mount 65” TV in conference room','AV / TV / Displays',45,'URGENT'],['Trace ceiling ethernet run','Networking & Cabling',60,'MEDIUM'],['Configure new coffee machine','Kitchen & Appliances',30,'LOW']];
let tasks=JSON.parse(localStorage.getItem(key)||'null')||seed.map(([title,category,minutes,priority],i)=>({id:crypto.randomUUID(),title,category,minutes,priority,status:'OPEN',createdAt:Date.now()-i*86400000,location:i===1?'Conference room B':'',deadline:i===1?new Date(Date.now()+86400000).toISOString().slice(0,10):''}));
const $=s=>document.querySelector(s), save=()=>localStorage.setItem(key,JSON.stringify(tasks)), estimate=t=>{let n=/mount|hang|install/i.test(t)?45:/assemble|build/i.test(t)?60:/trace|cable|wire|network|router/i.test(t)?60:/configure|set ?up/i.test(t)?30:/clean|organize|restock/i.test(t)?20:/buy|order|move|carry/i.test(t)?15:/event|usher|greet/i.test(t)?120:30;let q=t.match(/\b(\d+)\s+(?:\w+\s+)?(?:cameras|monitors|chairs|desks)\b/i);if(q)n*=1+.8*(+q[1]-1);return Math.round(n/5)*5};
const score=t=>({URGENT:100,HIGH:60,MEDIUM:30,LOW:10}[t.priority]+(t.deadline&&new Date(t.deadline)<new Date()?80:0)+(Date.now()-t.createdAt)/86400000);
function render(){let q=$('#search').value.toLowerCase(), st=$('#status').value, p=$('#priority').value;let view=tasks.filter(t=>(st==='active'?t.status!=='COMPLETED':t.status===st)&&(!p||t.priority===p)&&t.title.toLowerCase().includes(q)).sort((a,b)=>score(b)-score(a));let open=tasks.filter(t=>t.status!=='COMPLETED'),late=open.filter(t=>t.deadline&&new Date(t.deadline)<new Date()),mins=open.reduce((n,t)=>n+t.minutes,0);$('#openCount').textContent=open.length;$('#overdueCount').textContent=late.length;$('#hours').textContent='~'+(mins/60).toFixed(1)+' h';$('#tasks').innerHTML=view.length?view.map(t=>{let over=t.deadline&&new Date(t.deadline)<new Date();return `<article class="task ${over?'overdue':''}"><button class="check" data-done="${t.id}" aria-label="Complete ${t.title}">✓</button><div class="main"><div class="title">${esc(t.title)}</div><div class="meta"><span>${esc(t.category||'Other')}</span>${t.location?`<span>⌖ ${esc(t.location)}</span>`:''}<span>◷ ${t.minutes} min · Auto</span>${t.deadline?`<span class="${over?'overdue':''}">${over?'Overdue · ':''}Due ${t.deadline}</span>`:''}</div></div><span class="pill ${t.priority}">${t.priority}</span><div class="actions">${t.status==='OPEN'?`<button class="mini" data-start="${t.id}">Start</button>`:''}<button class="mini" data-delete="${t.id}">Delete</button></div></article>`}).join(''):'<div class="panel empty">No open tasks 🎉 — nothing to do. Add one or check the archive.</div>';save()}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#newTask').onclick=()=>$('#taskDialog').showModal(); document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close()); $('#search').oninput=render;$('#status').onchange=render;$('#priority').onchange=render;
$('#taskForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),title=f.get('title').trim();tasks.unshift({id:crypto.randomUUID(),title,location:f.get('location').trim(),priority:f.get('priority'),deadline:f.get('deadline'),category:'Other',minutes:estimate(title),status:'OPEN',createdAt:Date.now()});e.target.reset();$('#taskDialog').close();render()};
$('#tasks').onclick=e=>{let id=e.target.dataset.done||e.target.dataset.start||e.target.dataset.delete;if(!id)return;let t=tasks.find(x=>x.id===id);if(e.target.dataset.done){t.status='COMPLETED';t.completedAt=Date.now()}else if(e.target.dataset.start)t.status='IN_PROGRESS';else tasks=tasks.filter(x=>x.id!==id);render()};
$('#plan').onclick=()=>{$('#planDialog').showModal();makePlan()};$('#minutes').oninput=makePlan;function makePlan(){let avail=+$('#minutes').value||60,total=0,picks=tasks.filter(t=>t.status==='OPEN').sort((a,b)=>score(b)-score(a)).filter(t=>{if(total+t.minutes<=avail){total+=t.minutes;return true}});$('#planResult').innerHTML=picks.length?`<b>${total} of ${avail} minutes planned (${Math.round(total/avail*100)}%)</b><br>${picks.map(t=>esc(t.title)+` · ${t.minutes} min`).join('<br>')}`:'No open task fits this session.'}
$('#archive').onclick=()=>{let done=tasks.filter(t=>t.status==='COMPLETED');$('#archiveList').innerHTML=done.length?done.map(t=>`<div class="archive-row"><span><b>${esc(t.title)}</b><br><small>${t.minutes} min estimated</small></span><button class="mini" data-reopen="${t.id}">Reopen</button></div>`).join(''):'<p class="notice">No completed tasks yet.</p>';$('#archiveDialog').showModal()};$('#archiveList').onclick=e=>{let t=tasks.find(x=>x.id===e.target.dataset.reopen);if(t){t.status='OPEN';render();$('#archiveDialog').close()}};render();
</script></body></html>
